<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Diffusion backbone results</title><desc id="desc">Mean LIBERO success is 82.2 percent for Dream-7B and 76.3 percent for matched Qwen2.5-7B, a 5.9 percentage point gain. Single-seed simulation study.</desc><rect width="640" height="400" fill="#ecefe9"/><g font-family="Arial,sans-serif" fill="#181a1d"><text x="42" y="51" font-size="13" letter-spacing="2">LIBERO · MEAN SUCCESS</text><text x="42" y="115" font-size="46">+5.9<tspan font-size="18"> points</tspan></text><text x="42" y="153" font-size="16" fill="#63686f">Same flow expert. Different pretraining prior.</text><text x="42" y="207" font-size="15">Dream-7B · diffusion</text><rect x="42" y="222" width="434" height="30" fill="#405f86"/><text x="493" y="244" font-size="18">82.2%</text><text x="42" y="284" font-size="15">Qwen2.5-7B · autoregressive</text><rect x="42" y="299" width="403" height="30" fill="#919b98"/><text x="461" y="321" font-size="18">76.3%</text><text x="42" y="374" font-size="12" fill="#63686f">0–100% scale · single seed · simulation only</text></g></svg>
